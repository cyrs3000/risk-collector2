name: collect

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collect.py", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Collect
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python collect.py
      - name: Commit data
        run: |
          git config user.name "risk-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
